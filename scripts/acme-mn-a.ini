; Zone A MN-CSE for the CSE handover demo (tools/handover_demo.py), registers with the IN-CSE (scripts/acme.ini)
[basic.config]
cseType=MN
cseID=id-mn-a
cseName=cse-mn-a
adminID=CAdmin
dataDirectory=${baseDirectory}
networkInterface=0.0.0.0
cseHost=127.0.0.1
httpPort=8081
logLevel=info
databaseType=memory
consoleTheme=light
registrarCseHost=127.0.0.1
registrarCsePort=8080
registrarCseID=id-in
registrarCseName=cse-in

[cse.registration]
allowedCSROriginators=/id-in
allowedAEOriginators=C*,S*

[textui]
startWithTUI=False
