; Secured site CSE: HTTPS only (:8443) and the oneM2M MQTT binding over TLS to the site broker (:8883),
; certificates from scripts/certs.sh (copied to <base>/certs by scripts/acme.sh), broker password from
; the environment (ACME_MQTT_SECURITY_USERNAME / _PASSWORD).  docs/transport-security.md
[basic.config]
cseType=IN
cseID=id-sec
cseName=cse-sec
adminID=CAdmin
dataDirectory=${baseDirectory}
networkInterface=127.0.0.1
cseHost=127.0.0.1
httpPort=8443
logLevel=info
databaseType=memory
consoleTheme=light

[cse.registration]
allowedAEOriginators=C*,S*

[http.security]
useTLS=true
tlsVersion=auto
; server-authenticated TLS: clients verify the CSE against the site CA (ACME's server context would
; demand client certificates without a CA to check them against)
verifyCertificate=false
caCertificateFile=${basic.config:baseDirectory}/certs/acme_cert.pem
caPrivateKeyFile=${basic.config:baseDirectory}/certs/acme_key.pem

[mqtt]
enable=true
address=127.0.0.1
port=8883

[mqtt.security]
useTLS=true
verifyCertificate=true
caCertificateFile=${basic.config:baseDirectory}/certs/ca.crt

[textui]
startWithTUI=False
