name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACME_DIR: /tmp/acme                  # zone MN-CSEs are (re)started by scripts/acme.sh in several steps
      ACME_PYTHON: /tmp/acmevenv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python deps (CPU torch for the LSTM test)
        run: |
          pip install -r requirements.txt pytest httpx
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: ArduinoJson for the firmware type-check
        run: git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git /tmp/arduinojson
      - name: Tests
        env:
          ARDUINOJSON_SRC: /tmp/arduinojson/src
        run: python -m pytest -q

      - name: Firmware in the loop (real firmware compiled for the PC, on an ACME CSE)
        env:
          ARDUINOJSON_SRC: /tmp/arduinojson/src
        run: |
          git clone --depth 1 https://github.com/ankraft/ACME-oneM2M-CSE.git /tmp/acme
          python -m venv /tmp/acmevenv            # own venv: ACME pins packages the MEC app needs newer
          /tmp/acmevenv/bin/pip install -q -r /tmp/acme/requirements.txt
          ACME_DIR=/tmp/acme ACME_PYTHON=/tmp/acmevenv/bin/python scripts/acme.sh start in   # + EdgeGuard SDT domain
          python tools/sil_run.py --scene crossing
          python tools/sil_run.py --scene head_on --out results/sil_run_head_on.json

      - name: SDT data model (flexContainer twins, label discovery, SAREF semantic query, onboarding)
        env:
          EDGEGUARD_CONFIG: config/site.yaml
          EDGEGUARD_OVERRIDES: config/local-acme.yaml,config/live-demo.yaml
        run: |
          bash scripts/mec.sh restart
          (timeout 90 python devices/live_devices.py --scene crossing --seconds 40 --start-delay 5 > /tmp/live.out 2>&1 &)
          sleep 2
          python tools/setup_resources.py --reset
          sleep 10
          python deploy/check_sdt.py --onboard

      - name: CSE handover between zone MN-CSEs (location trigger, then availability failover)
        run: |
          scripts/acme.sh start mn-a mn-b
          sleep 5
          python tools/handover_demo.py
          python tools/handover_demo.py --failover --out results/handover_failover.json

      - name: Mobility via ETSI MEC (zone events + RNIS into oneM2M, network-triggered handover)
        run: |
          scripts/acme.sh start mn-a mn-b
          sleep 3
          python tools/mobility_demo.py

      - name: AI safety agent over MCP servers (oneM2M IN + zone MN-CSEs, ETSI MEC)
        run: |
          bash scripts/mec.sh stop             # the MEC app of the data-model step would onboard the demo's devices
          python tools/agent_demo.py

      - name: Federated learning through oneM2M (TR-0084 roles, dropout, late join)
        run: python tools/fl_demo.py

      - name: Zone broadcast (group fan-out to tags behind NAT via pollingChannel)
        run: python tools/zone_demo.py

      - name: MEC app orchestration across hosts (intent -> discover, select, deploy, register, provision; host crash)
        run: |
          python tools/orchestration_demo.py
          python tools/orchestration_demo.py --runtime docker     # one container per instance (deploy/edge-app)

      - name: Forklift swarm coordination (group context, same schedule on every member)
        run: python tools/swarm_demo.py

      - name: Federated model delivery (canary, activate, monitor, roll back; risk engine guidance_fl)
        run: python tools/model_delivery_demo.py

      - name: Secured transport (devices on MQTT/TLS, apps on HTTPS, attacks refused)
        run: |
          diag() { echo "::error title=secure $1::$(tail -c 1500 "$2" 2>/dev/null | tr '\n' '|')"; }
          (sudo apt-get install -y -q mosquitto > /tmp/apt.log 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q mosquitto)) > /tmp/apt.log 2>&1 \
            || { diag apt /tmp/apt.log; exit 1; }
          bash scripts/mqtt.sh start || { diag broker .mqtt/mosquitto.log; exit 1; }
          if ! bash scripts/acme.sh start sec; then          # seen once: startup error on a fresh runner; restart the broker and retry
            echo "::warning title=secure acme retry::$(grep -A3 'Error during startup' .acme/sec/acme.out | tr -s ' ' | tr '\n' '|' | cut -c1-900)"
            bash scripts/acme.sh stop sec; bash scripts/mqtt.sh start
            bash scripts/acme.sh start sec || { diag acme .acme/sec/acme.out; exit 1; }
          fi
          python tools/secure_transport_demo.py || { diag broker .mqtt/mosquitto.log; diag acme .acme/sec/acme.out; exit 1; }

      - name: Firmware in the loop over the oneM2M MQTT binding (TLS, broker ACL)
        env:
          ARDUINOJSON_SRC: /tmp/arduinojson/src
        run: |
          sudo apt-get install -y -q libmosquitto-dev > /dev/null
          bash scripts/mec.sh stop
          bash scripts/mqtt.sh start                   # restarts the broker with the device users
          bash scripts/acme.sh stop in
          ACME_MQTT=1 bash scripts/acme.sh start in
          python tools/sil_run.py --transport mqtt --out results/sil_run_mqtt.json
          bash scripts/device_cert.sh issue SWorker01 && bash scripts/device_cert.sh issue SForklift01
          bash scripts/mqtt.sh reload
          python tools/sil_run.py --transport mqtt-mtls --out results/sil_run_mtls.json   # device certificates

      - name: Device identity by certificate (mutual TLS, rotation, revocation)
        run: python tools/device_identity_demo.py

      - name: SIL logs on failure
        if: failure()
        run: |
          echo "::error title=mec.log::$(tail -15 mec.log 2>/dev/null | tr '\n' '|' | cut -c1-1500)"
          echo "::error title=acme.out::$(tail -15 .acme/in/acme.out 2>/dev/null | tr '\n' '|' | cut -c1-1500)"
          for z in mn-a mn-b; do echo "::error title=acme $z::$(grep -v '^\s*$' .acme/$z/acme.out 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-1500)"; done
          for z in mn-a mn-b sec; do echo "::error title=acme $z errors::$(grep -E 'Error|rror:|Exception|in use' .acme/$z/acme.out 2>/dev/null | tail -8 | tr '\n' '|' | cut -c1-1500)"; done

