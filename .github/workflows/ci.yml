name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python deps (CPU torch for the LSTM test)
        run: |
          pip install -r requirements.txt pytest httpx
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: ArduinoJson for the firmware type-check
        run: git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git /tmp/arduinojson
      - name: Tests
        env:
          ARDUINOJSON_SRC: /tmp/arduinojson/src
        run: python -m pytest -q

      - name: Firmware in the loop (real firmware compiled for the PC, on an ACME CSE)
        env:
          ARDUINOJSON_SRC: /tmp/arduinojson/src
        run: |
          git clone --depth 1 https://github.com/ankraft/ACME-oneM2M-CSE.git /tmp/acme
          pip install -r /tmp/acme/requirements.txt
          mkdir -p .acme && cp scripts/acme.ini .acme/
          (cd /tmp/acme && nohup python -m acmecse --base-directory "$GITHUB_WORKSPACE/.acme" --config acme.ini </dev/null > /tmp/acme.out 2>&1 &)
          for i in $(seq 60); do curl -sf -H "X-M2M-Origin: CAdmin" -H "X-M2M-RI: 1" -H "X-M2M-RVI: 3" localhost:8080/cse-in >/dev/null && break; sleep 1; done
          python tools/sil_run.py --scene crossing
          python tools/sil_run.py --scene head_on --out results/sil_run_head_on.json

      - name: SIL logs on failure
        if: failure()
        run: |
          echo "::error title=mec.log::$(tail -15 mec.log 2>/dev/null | tr '\n' '|' | cut -c1-1500)"
          echo "::error title=acme.out::$(tail -15 /tmp/acme.out 2>/dev/null | tr '\n' '|' | cut -c1-1500)"

