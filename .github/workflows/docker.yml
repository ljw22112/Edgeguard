name: docker
# Build the MEC host images with the official base images, run the whole stack end to end
# (MariaDB + Mobius + MEC app + virtual devices), check a restart with the database kept,
# and publish the images to GHCR on main.
on:
  push:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: deploy/docker-compose.yml
      COMPOSE_PROFILES: demo
      DEMO_RUNS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          set -o pipefail
          docker compose build --progress plain 2>&1 | tee /tmp/build.log

      - name: Start the stack and play the demo encounters
        run: |
          mkdir -p deploy/out && chmod 777 deploy/out
          docker compose up -d
          docker compose wait devices
          docker compose ps -a

      - name: Check alerts end to end
        run: python3 deploy/check_demo.py deploy/out/devices.json http://localhost:9090/health

      - name: Restart with the database kept, play again
        run: |
          docker compose down
          rm -f deploy/out/devices.json
          docker compose up -d
          docker compose wait devices
          docker compose logs mobius | grep "schema present"
          python3 deploy/check_demo.py deploy/out/devices.json http://localhost:9090/health

      - name: HA fail-over (kill the leader MEC app, standby takes over)
        env:
          MEC_HA: "1"
          COMPOSE_PROFILES: demo,ha
        run: |
          docker compose up -d --no-deps mec mec2
          python3 deploy/check_ha.py

      - name: Monitoring (Prometheus scrapes the MEC app, Grafana has the dashboard)
        env:
          COMPOSE_PROFILES: demo,ha,monitoring
          MEC_HA: "1"
        run: |
          docker compose up -d --no-deps prometheus grafana
          python3 deploy/check_monitoring.py

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > /tmp/stack.log 2>&1 || true
          tail -300 /tmp/stack.log
          # also as an annotation (readable through the API, unlike raw job logs)
          for f in /tmp/build.log /tmp/stack.log; do
            [ -s "$f" ] || continue
            msg=$(grep -v '^\s*$' "$f" | tail -45 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename $f)::$msg"
          done

      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in edgeguard-mec edgeguard-mobius; do
            src=ghcr.io/ljw22112/$img:local
            for tag in latest sha-${GITHUB_SHA::7}; do
              docker tag $src ghcr.io/ljw22112/$img:$tag
              docker push ghcr.io/ljw22112/$img:$tag
            done
          done

      - name: Stop
        if: always()
        run: docker compose down -v
