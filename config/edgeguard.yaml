# EdgeGuard configuration
# Switch between ACME (local test) and Mobius (team server) by editing `cse`.

cse:
  base_url: http://localhost:8080   # Mobius default: http://<server>:7579
  cse_rn: cse-in                    # Mobius: Mobius
  origin: CEdgeGuard                # AE originator (Mobius accepts S... or C...)
  rvi: "3"

ae: EdgeGuard

devices:
  workers: [worker_01]
  forklifts: [forklift_01]
  cameras: [camera_01]

mec:
  listen_host: 0.0.0.0
  listen_port: 9090
  notify_url: http://localhost:9090/notify   # URL the CSE can reach
  method: guidance_ctrv                       # guidance | guidance_ctrv | distance | ttc
  risk_publish_hz: 2                          # risk summary rate written to the CSE
  emulated_extra_delay_ms: 0                  # >0 emulates a cloud round-trip for comparisons

device_sim:
  listen_port: 9091
  notify_url: http://localhost:9091/alert

# Real devices that should receive alerts (ESP32 worker tags / forklift modules)
alert_subscribers: []
#  - http://192.168.0.21/alert     # worker_01 tag
#  - http://192.168.0.31/alert     # forklift_01 module

# Copy risk/alerts to a cloud CSE (disabled for the local ACME demo; see config/site.yaml)
cloud_sync:
  enabled: false

# Camera node (devices/camera_node.py): pixel -> floor-metre calibration, >= 4 points [u, v, x, y]
camera:
  conf: 0.4
  calib_points:                      # example for the 810x1080 sample image; re-measure on site
    - [0, 1080, 0.0, 0.0]
    - [810, 1080, 6.0, 0.0]
    - [810, 400, 6.0, 12.0]
    - [0, 400, 0.0, 12.0]
  fuse_gate_m: 1.5                   # detection within this distance of a tag track = same person

risk:
  r_safe: 1.5
  t_danger: 1.5
  t_warn: 3.0
  t_caution: 5.0
  m_warn: 0.3
  m_caution: 1.0
  horizon: 5.0
