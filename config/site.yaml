# Recommended site deployment (see README "Deployment architecture")
#   edge : Mobius IN-CSE on the MEC host  -> real-time loop never leaves the site
#   cloud: second Mobius IN-CSE           -> risk summaries + alerts copied by the MEC app
# Use: EDGEGUARD_CONFIG=config/site.yaml

cse:
  base_url: http://localhost:7579   # Mobius on the MEC host
  cse_rn: Mobius
  origin: SEdgeGuard
  rvi: "2a"

ae: EdgeGuard

devices:
  workers: [worker_01]
  forklifts: [forklift_01]
  cameras: [camera_01]

mec:
  listen_host: 0.0.0.0
  listen_port: 9090
  notify_url: http://localhost:9090/notify   # URL the CSE can reach
  method: guidance_ctrv                       # guidance | guidance_ctrv | distance | ttc
  risk_publish_hz: 2                          # risk summary rate written to the CSE
  emulated_extra_delay_ms: 0                  # >0 emulates a cloud round-trip for comparisons

device_sim:
  listen_port: 9091
  notify_url: http://localhost:9091/alert

# Real devices that should receive alerts (ESP32 worker tags / forklift modules)
alert_subscribers: []
#  - http://192.168.0.21/alert     # worker_01 tag
#  - http://192.168.0.31/alert     # forklift_01 module

# Copy of risk summaries / alerts to the cloud Mobius (separate queue: a slow or
# broken WAN never delays local alerts; failures are counted in /health).
cloud_sync:
  enabled: true
  base_url: http://cloud.example.com:7579    # cloud Mobius address
  cse_rn: Mobius
  origin: SEdgeGuard
  rvi: "2a"
  ae: EdgeGuard_site01                       # one AE per site
  risk_hz: 1

# ETSI MEC services (Location API MEC 013, RNIS MEC 012) on the MEC platform.
# For local tests run the stand-in: uvicorn mec_mock.server:app --port 8085
mec_services:
  enabled: false                             # true when a MEC platform / the MEC Sandbox is reachable
  # cse: read MEC data as oneM2M resources written by MEC-IPE (Hackathon MEC Sandbox, preferred)
  # direct: call the MEC APIs from the MEC app
  location_source: cse
  ipe:
    root: MEC-IPE                            # where MEC-IPE writes location/<ue> and rnis/<cell>
    origin: SMecIpe                          # tools/mec_ipe.py (stand-in) originator
    discover_s: 5
    poll_s: 0.25
  base_url: http://localhost:8085            # MEC platform (direct mode and tools/mec_ipe.py)
  location_api: location/v3
  rnis_api: rni/v2
  origin: {lat: 37.5503, lon: 127.0731}      # site frame origin (x = east, y = north)
  # Location API address -> device (scenarios/edgeguard-warehouse.yaml uses these addresses)
  ue_map:
    "10.100.0.1":  {id: worker_01, kind: worker}
    "10.100.0.2":  {id: worker_02, kind: worker}
    "10.100.0.3":  {id: worker_03, kind: worker}
    "10.100.0.4":  {id: worker_04, kind: worker}
    "10.100.0.11": {id: forklift_01, kind: forklift}
    "10.100.0.12": {id: forklift_02, kind: forklift}
  uwb_stale_s: 0.5                           # a network fix is used when the UWB tag is silent this long
  cell_id: null                              # null: the most loaded cell of the site counts
  congestion_prb_pct: 80                     # RNIS cell load that counts as congested
  congested_margin_s: 0.5                    # extra warning time while congested
  poll_s: 0.25
  rnis_poll_s: 1.0

# Camera node (devices/camera_node.py): pixel -> floor-metre calibration, >= 4 points [u, v, x, y]
camera:
  conf: 0.4
  calib_points:                      # example for the 810x1080 sample image; re-measure on site
    - [0, 1080, 0.0, 0.0]
    - [810, 1080, 6.0, 0.0]
    - [810, 400, 6.0, 12.0]
    - [0, 400, 0.0, 12.0]
  fuse_gate_m: 1.5                   # detection within this distance of a tag track = same person

# Access control: each device may write only its own container; risk/alert are MEC-only.
security:
  enabled: true
  originators: {worker_01: SWorker01, forklift_01: SForklift01, camera_01: SCamera01}

risk:
  r_safe: 1.5
  t_caution: 5.0
  m_caution: 1.0
  horizon: 5.0
  # trained policy (sim/train_policy.py, C=50) - see README "정책 학습"
  t_warn: 4.108
  t_danger: 1.669
  m_warn: 0.246
  worker_react: 0.894
  brake_decel: 2.317
  brake_margin: 0.944
  lane_lookahead: 4.961
  pass_speed: 1.681
  clear_hold: 2.464
  stand_speed: 0.577

# Adaptive reporting rate (edgeguard/rate_control.py): devices with no counterpart close or
# closing in report at 2 Hz, the rest at 10 Hz; commands go to <ae>/control.  On by default:
# at 40 devices it cut collisions 9 -> 1 and alert latency p95 3.4 s -> 1.1 s (online sim).
rate_control:
  enabled: true
  near_m: 8.0
  horizon_s: 2.0
  reach_s: 5.0
  slow_hz: 2.0
  fast_hz: 10.0
  hold_s: 3.0
  heartbeat_s: 1.0      # also the forklift silence fail-safe (edgeguard/device_policy.py)
