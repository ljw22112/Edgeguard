title = "EdgeGuard walkers (sim/walkers.py): PySocialForce defaults, 0.1 s steps, no groups"

# PedState reads these from the top level (pysocialforce 1.1.2 passes the whole config, not [scene]):
# without them it silently steps 0.4 s and caps at 1.3 x the initial speed
step_width = 0.1
max_speed_multiplier = 1.0
tau = 0.5
agent_radius = 0.35

[scene]
enable_group = false
agent_radius = 0.35
step_width = 0.1
max_speed_multiplier = 1.0
tau = 0.5
resolution = 10

[desired_force]
factor = 1.0
relaxation_time = 0.5
goal_threshold = 0.2

[social_force]
factor = 5.1
lambda_importance = 2.0
gamma = 0.35
n = 2
n_prime = 3

[obstacle_force]
factor = 10.0
sigma = 0.2
threshold = 3.0
