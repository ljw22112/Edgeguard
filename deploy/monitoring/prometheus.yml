# EdgeGuard monitoring (compose profile `monitoring`): scrape the MEC app(s) every 2 s.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: edgeguard-mec
    metrics_path: /metrics
    static_configs:
      - targets: ["mec:9090"]
        labels: {instance_id: mec}
      - targets: ["mec2:9090"]          # ha profile; shows as down when not running
        labels: {instance_id: mec2}
