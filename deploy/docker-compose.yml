# EdgeGuard MEC host: MariaDB + Mobius (oneM2M IN-CSE) + MEC app.
#
#   cd deploy && docker compose up -d                       # the MEC host stack
#   docker compose --profile demo up                        # + resource setup + virtual devices
#   open http://localhost:9090/                             # dashboard
#
# Images: built from this repository, or pulled from GHCR when EDGEGUARD_IMAGE_TAG is set
# (CI publishes ghcr.io/ljw22112/edgeguard-mec and edgeguard-mobius on every push to main).
# Real devices: add their alert URLs to `alert_subscribers` (config) and point them at
# http://<host>:7579/Mobius.

name: edgeguard

x-mec-image: &mec-image
  image: ${EDGEGUARD_REGISTRY:-ghcr.io/ljw22112}/edgeguard-mec:${EDGEGUARD_IMAGE_TAG:-local}
  # build locally by default (no registry login needed); set EDGEGUARD_PULL_POLICY=always together
  # with EDGEGUARD_IMAGE_TAG=latest to use the images CI publishes to GHCR
  pull_policy: ${EDGEGUARD_PULL_POLICY:-build}
  build:
    context: ..
    dockerfile: mec_app/Dockerfile
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}

x-mec-env: &mec-env
  EDGEGUARD_CONFIG: /app/config/site.yaml
  # second layer exists only while connected to an ETSI MEC Sandbox (tools/sandbox_probe.py)
  EDGEGUARD_OVERRIDES: /app/deploy/compose-overrides.yaml,/app/deploy/sandbox/overrides.yaml

services:
  mariadb:
    image: ${DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_ROOT_PASSWORD: ${MOBIUS_DB_PASS:-edgeguard-db}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      default:
        aliases: [mobius]            # Mobius shares this container's network namespace
    ports:
      - "${MOBIUS_PUBLISH:-7579}:7579"   # Mobius, for real devices on the site network
    healthcheck:
      # a real authenticated query (mariadb-admin ping succeeds even when the password is wrong)
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1' > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  mobius:
    image: ${EDGEGUARD_REGISTRY:-ghcr.io/ljw22112}/edgeguard-mobius:${EDGEGUARD_IMAGE_TAG:-local}
    pull_policy: ${EDGEGUARD_PULL_POLICY:-build}
    build:
      context: mobius
      additional_contexts:
        mobius-src: ${MOBIUS_SRC:-https://github.com/IoTKETI/Mobius.git#3ddd305857c0bfadffa5ac88af47841365f722cb}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
    network_mode: "service:mariadb"  # Mobius connects to MySQL at localhost:3306 (fixed in Mobius)
    environment:
      MOBIUS_DB_PASS: ${MOBIUS_DB_PASS:-edgeguard-db}
      MOBIUS_MQTT_BROKER: mqtt
    depends_on:
      mariadb:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  mqtt:
    # Mobius always opens an MQTT client for MQTT-bound notifications; without a broker it
    # retries forever in the log.  Anonymous access on the internal network only (not published).
    image: ${MQTT_IMAGE:-eclipse-mosquitto:2}
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    restart: unless-stopped

  mec:
    <<: *mec-image
    environment: *mec-env
    volumes:
      - ./sandbox:/app/deploy/sandbox:ro
    ports:
      - "${MEC_PUBLISH:-9090}:9090"  # dashboard + /health
    depends_on:
      mobius:
        condition: service_healthy
    restart: unless-stopped

  # ---- demo profile: virtual devices and the oneM2M resource tree ----
  devices:
    <<: *mec-image
    profiles: [demo]
    user: "0:0"                      # writes the result file into ./out on the host
    healthcheck: {disable: true}
    environment: *mec-env
    command: ["python3", "devices/device_sim.py", "--scenario", "${DEMO_SCENARIO:-crossing_conflict}",
              "--runs", "${DEMO_RUNS:-4}", "--start-delay", "12", "--quiet", "--json-out", "/out/devices.json"]
    volumes:
      - ./out:/out
    depends_on:
      mec:
        condition: service_healthy

  setup:
    <<: *mec-image
    profiles: [demo]
    environment: *mec-env
    command: ["python3", "tools/setup_resources.py", "--reset"]
    healthcheck: {disable: true}
    depends_on:
      devices:
        condition: service_started   # subscriptions are verified against the devices' listener
    restart: "no"

  # ---- ETSI MEC Sandbox (https://try-mec.etsi.org) ----
  #   docker compose run --rm sandbox-setup <base URL from the Sandbox dashboard>
  #   docker compose --profile sandbox up -d --force-recreate
  #   docker compose run --rm sandbox-check
  sandbox-setup:                     # finds the APIs and UEs, writes ./sandbox/overrides.yaml
    <<: *mec-image
    profiles: [sandbox-setup]
    user: "0:0"
    healthcheck: {disable: true}
    environment: *mec-env
    entrypoint: ["python3", "tools/sandbox_probe.py", "--out", "/app/deploy/sandbox/overrides.yaml"]
    volumes:
      - ./sandbox:/app/deploy/sandbox
    restart: "no"

  mec-ipe:                           # MEC 013 / 012 data from the Sandbox -> oneM2M resources
    <<: *mec-image
    profiles: [sandbox]
    healthcheck: {disable: true}
    environment: *mec-env
    command: ["python3", "tools/mec_ipe.py"]
    volumes:
      - ./sandbox:/app/deploy/sandbox:ro
    depends_on:
      mec:
        condition: service_healthy
    restart: unless-stopped

  sandbox-check:                     # what flowed, written to ./sandbox/report.json
    <<: *mec-image
    profiles: [sandbox-check]
    user: "0:0"
    healthcheck: {disable: true}
    environment: *mec-env
    command: ["python3", "tools/sandbox_check.py"]
    volumes:
      - ./sandbox:/app/deploy/sandbox
    restart: "no"

volumes:
  db-data:
